apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-lab
  namespace: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ci-lab
  template:
    metadata:
      labels:
        app: ci-lab
    spec:
      containers:
        - name: ci-lab
          image: ghcr.io/darmren/ci-lab-1-staging:c76e988
          ports:
            - containerPort: 3000
