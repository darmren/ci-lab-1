name: Lab 1 CI setup

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: ./gradlew dependencies

      - name: Lint code
        run: ./gradlew checkstyleMain checkstyleTest

      - name: Tests with coverage and report
        run: ./gradlew test jacocoTestCoverageVerification

      - name: Coverage summary
        if: always()
        run: |
          CSV=build/reports/jacoco/test/jacocoTestReport.csv
          PCT=$(awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "%.2f", c*100/(m+c)}' $CSV)
          echo "Instruction coverage: $PCT%"
          echo "### Coverage: $PCT%" >> $GITHUB_STEP_SUMMARY

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/jacoco/test/html

      - name: Build with Gradle Wrapper
        run: ./gradlew bootJar
