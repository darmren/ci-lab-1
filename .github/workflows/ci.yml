name: Lab 3 CI integration promotion

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: ./gradlew dependencies

      - name: Lint code
        run: ./gradlew checkstyleMain checkstyleTest checkstyleIntegrationTest

      - name: Tests with coverage and report
        run: ./gradlew test jacocoTestCoverageVerification

      - name: Coverage summary
        if: always()
        run: |
          CSV=build/reports/jacoco/test/jacocoTestReport.csv
          PCT=$(awk -F, 'NR>1 {m+=$8; c+=$9} END {printf "%.2f", c*100/(m+c)}' $CSV)
          echo "Instruction coverage: $PCT%"
          echo "### Coverage: $PCT%" >> $GITHUB_STEP_SUMMARY

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/jacoco/test/html

      - name: Build with Gradle Wrapper
        run: ./gradlew bootJar

  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Integration tests (parallel forks)
        run: ./gradlew integrationTest -PitForks=3

      - name: Save integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: build/reports/tests/integrationTest

  docker:
    runs-on: ubuntu-latest
    needs: [build, integration-tests]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute short SHA and image name
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build image (no push) with layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ci-lab:${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6

      - name: Trivy full report
        run: trivy image --format table --output trivy-report.txt ci-lab:${{ env.SHORT_SHA }}

      - name: SBOM generation (SPDX)
        run: trivy image --format spdx-json --output sbom.spdx.json ci-lab:${{ env.SHORT_SHA }}

      - name: Trivy quality gate (HIGH/CRITICAL with available fix)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 ci-lab:${{ env.SHORT_SHA }}

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (tags by SHA and run number)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          docker tag ci-lab:$SHORT_SHA $IMAGE:$SHORT_SHA
          docker tag ci-lab:$SHORT_SHA $IMAGE:build-${{ github.run_number }}
          docker push $IMAGE:$SHORT_SHA
          docker push $IMAGE:build-${{ github.run_number }}

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-spdx
          path: sbom.spdx.json

  promote-to-staging:
    runs-on: ubuntu-latest
    needs: [ integration-tests, docker ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      packages: write

    steps:
      - name: Compute tag and image names
        run: |
          echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "SRC=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "DST=ghcr.io/${GITHUB_REPOSITORY,,}-staging" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Promote image without rebuild
        run: skopeo copy docker://$SRC:$TAG docker://$DST:$TAG

  update-manifest:
    runs-on: ubuntu-latest
    needs: [ promote-to-staging ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update image tag and commit
        run: |
          TAG=${GITHUB_SHA::7}
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-staging:${TAG}"
          MANIFEST=k8s-manifests/staging/deployment.yaml

          IMAGE="$IMAGE" yq -i '.spec.template.spec.containers[0].image = strenv(IMAGE)' "$MANIFEST"
          echo "Manifest image is now: $(yq '.spec.template.spec.containers[0].image' "$MANIFEST")"

          git config user.email "ci-bot@example.com"
          git config user.name "CI Bot"
          git add "$MANIFEST"

          if git diff --cached --quiet; then
            echo "Manifest already points to $IMAGE, nothing to commit"
            exit 0
          fi

          git commit -m "Deploy ${TAG} to staging"
          git push